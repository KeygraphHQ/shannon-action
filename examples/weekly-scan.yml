# Weekly deep scan of a deployed environment, with findings sent to code scanning.
name: Shannon weekly scan

on:
  schedule:
    - cron: '0 3 * * 1'   # every Monday at 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    # For larger repos or slower model providers, use a self-hosted runner (GitHub-hosted caps at 6h):
    # https://docs.github.com/actions/hosting-your-own-runners/adding-self-hosted-runners
    # runs-on: [self-hosted, linux]
    # timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4

      - name: Run Shannon
        uses: KeygraphHQ/shannon-action@v1
        with:
          url: ${{ vars.STAGING_URL }}
          config: .shannon/full.yaml
          upload-sarif: true
          api-key: ${{ secrets.SHANNON_AI_API_KEY }}
