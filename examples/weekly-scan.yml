# Weekly deep scan of a deployed environment, with findings sent to code scanning.
name: Shannon weekly scan

on:
  schedule:
    - cron: '0 3 * * 1'   # every Monday at 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Shannon
        uses: KeygraphHQ/shannon-action@v1
        with:
          url: ${{ vars.STAGING_URL }}
          config: .shannon/full.yaml
          upload-sarif: true
          api-key: ${{ secrets.SHANNON_AI_API_KEY }}
